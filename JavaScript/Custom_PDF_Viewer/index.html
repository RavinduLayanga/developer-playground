<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9c9f83c7fa.js" crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <title>PDF Viewer</title>
</head>

<body>
    <div class="top-bar">
        <button class="btn" id="prev-page">
            <i class="fas fa-arrow-circle-left" aria-hidden="true"></i> Prev Page
        </button>

        <button class="btn" id="next-page">
            Next Page <i class="fas fa-arrow-circle-right" aria-hidden="true"></i>
        </button>

        <span class="page-info">
            Page <span id="page-num"></span> of <span id="page-count"></span>
        </span>
    </div>

    <canvas id="pdf-render"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
