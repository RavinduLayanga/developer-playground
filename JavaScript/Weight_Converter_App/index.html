<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            margin-top: 70px;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #fff;
        }
    </style>
    <title>Weight Converter</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4 mx-auto">
                <h1 class="display-4 text-center mb-4">Weight Converter</h1>
                <form>
                    <div class="mb-3">
                        <label for="weightInput" class="form-label mt-3 mb-2">Enter weight in kilograms:</label>
                        <input type="number" class="form-control form-control-lg" id="weightInput"
                            placeholder="Enter weight in kg">
                    </div>
                </form>
                <div id="output" class="output mt-4">
                    <div class="card bg-primary text-white mb-3">
                        <div class="card-body">
                            <h4>Grams:</h4>
                            <div id="gramsOutput"></div>
                        </div>
                    </div>

                    <div class="card bg-success text-white mb-3">
                        <div class="card-body">
                            <h4>Pounds:</h4>
                            <div id="poundsOutput"></div>
                        </div>
                    </div>

                    <div class="card bg-danger text-white mb-3">
                        <div class="card-body">
                            <h4>Ounces:</h4>
                            <div id="ouncesOutput"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('output').style.display = 'none';
            document.getElementById('weightInput').addEventListener('input', (e) => {
                const kg = parseFloat(e.target.value);
                if (!isNaN(kg)) {
                    document.getElementById('output').style.display = 'block';
                    document.getElementById('gramsOutput').textContent = (kg * 1000).toFixed(2) + ' g';
                    document.getElementById('poundsOutput').textContent = (kg * 2.20462).toFixed(2) + ' lbs';
                    document.getElementById('ouncesOutput').textContent = (kg * 35.274).toFixed(2) + ' oz';
                } else {
                    document.getElementById('output').style.display = 'none';

                }
            });
        </script>

</body>

</html>
