<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9c9f83c7fa.js" crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="./bootstrap.min.css">
    <title>MyBooklist App</title>
</head>

<body>
    <div class="container mt-4 ">
        <h1 class="display-4 text-center">
            <i class="fas fa-book-open-reader text-primary"></i>
            My <span class="text-primary">Book</span> List
        </h1>
        <form id="book-form">
            <div class="form-group mt-2">
                <label for="title">Title</label>
                <input type="text" id="title" class="form-control" placeholder="Enter book title" required>
            </div>
            <div class="form-group mt-2">
                <label for="author">Author</label>
                <input type="text" id="author" class="form-control" placeholder="Enter book author" required>
            </div>
            <div class="form-group mt-2">
                <label for="isbn">ISBN#</label>
                <input type="text" class="form-control" id="isbn" placeholder="Enter book ISBN" required>
            </div>
            <div class="d-grid mt-4">
                <input type="submit" value="Add Book" class="btn btn-primary ">
            </div>
        </form>
        <table class="table table-striped mt-5">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN#</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="book-list">

            </tbody>


    </div>
    <script src="./app.js"></script>
</body>

</html>
