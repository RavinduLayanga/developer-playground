<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google Map</title>


    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>My Google Map</h1>
    <div id="map"></div>

    <script>
        function initMap() {
            // Map option
            const options = {
                zoom: 7,
                center: { lat: 7.8731, lng: 80.7718 }
            }

            // New map
            const map = new google.maps.Map(document.getElementById('map'), options);

            // Add listner for map
            map.addListener(map, 'click', (event) => {
                addMarker({ coords: event.latLng })
            });


            // Array of markers
            const markers = [{
                coords: { lat: 8.6853, lng: 81.1830 },
                iconImage: "https://developers.google.com/maps/documentation/javascript/examples/full/images/beachflag.png",
                content: '<h1>Nilaveli Beach</h1><p>Trincomalee</p>'

            },
            { coords: { lat: 6.9271, lng: 79.8576 }, content: '<h1>Lotus Tower (Nelum Kuluna)</h1><p>Colombo</p>' },

            { coords: { lat: 7.9570, lng: 80.7603 }, content: '<h1>Sigiriya Rock Fortress</h1><p>Central Province</p>' }
            ];

            // Loop through markers
            markers.forEach((markerData) => {
                addMarker(markerData);
            });


            // Add Marker Function
            function addMarker(props) {
                const marker = new google.maps.Marker({
                    position: props.coords,
                    map: map,

                });

                // check for customicon

                if (props.iconImage) {
                    marker.setIcon(props.iconImage);
                }

                if (props.content) {
                    const infoWindow = new google.maps.InfoWindow({
                        content: props.content
                    });

                    marker.addListener('click', () => {
                        infoWindow.open(map, marker);
                    });
                }
            }
        }
    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&loading=async&callback=initMap&libraries=maps,marker">
        </script>
</body>

</html>
