<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google Map</title>


    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>My Google Map</h1>
    <div id="map"></div>

    <script>
        function initMap() {
            let options = {
                zoom: 8,
                center: { lat: 42.3601, lng: -71.0589 }
            }

            let map = new google.maps.Map(document.getElementById('map'), options);
        }

    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&loading=async&callback=initMap&libraries=maps"></script>
</body>

</html>
